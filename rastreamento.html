<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#72cbbd" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <title>Quer Ajuda? — Rastreamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
  <script>
    (function() {
      try {
        var t = localStorage.getItem('querajuda.theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .rast-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 18px 80px;
    }
    .rast-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .rast-back {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    .rast-title {
      font-family: 'Nunito', sans-serif;
      font-size: 2rem;
      color: var(--text);
      margin: 0;
    }
    .idoso-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .idoso-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    .idoso-card__header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .idoso-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #72cbbd, #4a9b8e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
    }
    .idoso-info { flex: 1; }
    .idoso-nome {
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      margin: 0;
    }
    .idoso-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 2px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9e9e9e;
    }
    .status-dot.online { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
    .status-dot.offline { background: #9e9e9e; }
    .status-dot.sos { background: #f44336; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    .idoso-loc {
      background: var(--bg);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .idoso-loc strong { color: var(--text); display: block; margin-bottom: 4px; }
    .idoso-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-rast {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-rast--maps {
      background: #4285f4;
      color: white;
    }
    .btn-rast--zap {
      background: #25d366;
      color: white;
    }
    .empty-state {
      background: var(--card);
      border: 2px dashed var(--border);
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state__icon { font-size: 4rem; margin-bottom: 12px; }
    .refresh-info {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 16px;
    }
    .alerta-sos {
      background: linear-gradient(135deg, #ff5722, #d84315);
      color: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      font-weight: 700;
      text-align: center;
      animation: pulse-sos-bg 2s infinite;
    }
    @keyframes pulse-sos-bg {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="rast-container">
    <div class="rast-header">
      <a class="rast-back" href="home.html">← Voltar</a>
      <h1 class="rast-title">👨‍👩‍👧 Onde eles estão</h1>
    </div>

    <div id="alerta-sos" class="alerta-sos" style="display:none">
      🆘 ALERTA DE SOCORRO!<br>
      <small style="font-weight:400;opacity:0.9">Alguém pediu ajuda agora</small>
    </div>

    <div id="idosos-list"></div>

    <p class="refresh-info" id="refresh-info">Atualizando a cada 30 segundos...</p>
  </div>

  <script src="supabase.js?v=10"></script>
  <script>
  (function() {
    'use strict';

    function ready() {
      return new Promise((resolve) => {
        if (window.sbAPI) return resolve();
        const check = () => {
          if (window.sbAPI) resolve();
          else setTimeout(check, 50);
        };
        check();
      });
    }

    function $(id) { return document.getElementById(id); }

    function formatarHora(d) {
      const pad = n => n < 10 ? '0' + n : '' + n;
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function tempoAtras(iso) {
      if (!iso) return 'sem dados';
      const diff = Date.now() - new Date(iso).getTime();
      const min = Math.floor(diff / 60000);
      if (min < 1) return 'agora mesmo';
      if (min < 60) return 'há ' + min + ' min';
      const h = Math.floor(min / 60);
      if (h < 24) return 'há ' + h + 'h';
      return 'há ' + Math.floor(h / 24) + ' dia(s)';
    }

    async function carregar() {
      const user = await window.sbAPI.getCurrentUser();
      if (!user) { window.location.href = 'index.html'; return; }
      const profile = await window.sbAPI.getMyProfile();
      if (!profile || profile.role !== 'responsavel') {
        window.location.href = 'home.html';
        return;
      }

      // pega os idosos vinculados
      const { data: links, error: linkErr } = await window.sbAPI.supabase
        .from('care_links')
        .select('idoso_id')
        .eq('responsavel_id', user.id);

      if (linkErr || !links || links.length === 0) {
        $('idosos-list').innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-state__icon">🤝</div>' +
            '<h2 style="margin:0 0 8px;color:var(--text)">Nenhum idoso vinculado</h2>' +
            '<p>Volte na tela inicial e use o atalho <strong>"Vincular idoso"</strong> pra começar.</p>' +
          '</div>';
        return;
      }

      const ids = links.map(l => l.idoso_id);

      // pega profiles e localizacoes
      const [{ data: profiles }, { data: locs }, { data: sos }] = await Promise.all([
        window.sbAPI.supabase.from('profiles').select('id, full_name, phone').in('id', ids),
        window.sbAPI.supabase.from('localizacoes').select('*').in('user_id', ids),
        window.sbAPI.supabase.from('sos_alertas').select('*').in('user_id', ids).order('created_at', { ascending: false }).limit(1)
      ]);

      // alerta de SOS
      const alerta = $('alerta-sos');
      if (sos && sos.length > 0 && (Date.now() - new Date(sos[0].created_at).getTime() < 1800000)) {
        alerta.style.display = 'block';
        alerta.innerHTML = '🆘 <strong>' + (profiles?.find(p=>p.id===sos[0].user_id)?.full_name || 'Alguém') +
          '</strong> pediu socorro há ' + tempoAtras(sos[0].created_at) +
          '<br><a href="' + sos[0].maps_link + '" target="_blank" style="color:white;text-decoration:underline">Ver no mapa</a>';
      } else {
        alerta.style.display = 'none';
      }

      const html = (profiles || []).map(p => {
        const loc = (locs || []).find(l => l.user_id === p.id);
        const status = !loc ? 'offline' : (Date.now() - new Date(loc.updated_at).getTime() < 5 * 60000 ? 'online' : 'offline');
        const primeiroNome = (p.full_name || 'Idoso').split(' ')[0];
        const inicial = primeiroNome.charAt(0).toUpperCase();
        const mapsLink = loc ? ('https://maps.google.com/?q=' + loc.lat + ',' + loc.lng) : '#';
        const zapNum = (p.phone || '').replace(/\D/g, '') || '5511986059638';
        const zapMsg = encodeURIComponent('Oi ' + primeiroNome + ', tô checando se você tá bem! ❤️');

        return '<div class="idoso-card">' +
          '<div class="idoso-card__header">' +
            '<div class="idoso-avatar">' + inicial + '</div>' +
            '<div class="idoso-info">' +
              '<h2 class="idoso-nome">' + primeiroNome + '</h2>' +
              '<div class="idoso-status">' +
                '<span class="status-dot ' + status + '"></span>' +
                (status === 'online' ? 'Online agora' : 'Visto ' + tempoAtras(loc?.updated_at)) +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="idoso-loc">' +
            '<strong>📍 Localização</strong>' +
            (loc
              ? 'Atualizado ' + tempoAtras(loc.updated_at) +
                '<br><small>Lat ' + loc.lat.toFixed(5) + ', Lng ' + loc.lng.toFixed(5) + ' (±' + Math.round(loc.accuracy || 0) + 'm)</small>'
              : 'Ainda não compartilhou localização') +
          '</div>' +
          (loc
            ? '<div class="idoso-actions">' +
                '<a class="btn-rast btn-rast--maps" href="' + mapsLink + '" target="_blank">🗺️ Abrir no mapa</a>' +
                '<a class="btn-rast btn-rast--zap" href="https://wa.me/' + zapNum + '?text=' + zapMsg + '" target="_blank">💬 Mandar oi</a>' +
              '</div>'
            : '<div class="idoso-actions">' +
                '<a class="btn-rast btn-rast--zap" style="grid-column:span 2" href="https://wa.me/' + zapNum + '?text=' + zapMsg + '" target="_blank">💬 Mandar mensagem</a>' +
              '</div>') +
        '</div>';
      }).join('');

      $('idosos-list').innerHTML = html;
    }

    ready().then(async () => {
      await carregar();
      // atualiza a cada 30s
      setInterval(carregar, 30000);
    });

  })();
  </script>
</body>
</html>
