<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#72cbbd" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <title>Meus remédios — Quer Ajuda?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quer Ajuda?" />
  <link rel="stylesheet" href="styles.css?v=19" />
  <script>
    (function() {
      try {
        var t = localStorage.getItem('querajuda.theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>
<body class="home-body">
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema">
    <svg viewBox="0 0 24 24" aria-hidden="true" id="theme-icon">
      <path class="icon-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor" stroke="none"/>
      <g class="icon-sun" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </g>
      <g class="icon-auto" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/>
      </g>
    </svg>
  </button>

  <header class="home-header">
    <div class="home-header-inner">
      <a href="home.html" class="home-logo"><strong>Quer <span>Ajuda?</span></strong></a>
      <div class="home-header-actions">
        <a class="a11y-btn a11y-btn--ghost" href="home.html"><span aria-hidden="true">↩</span> Voltar</a>
        <a class="a11y-btn a11y-btn--ghost" href="#" data-action="logout"><span aria-hidden="true">⎋</span> Sair</a>
      </div>
    </div>
  </header>

  <main class="home-main">
    <section class="hero">
      <div class="hero-text">
        <h1 class="hero-title">Meus <span>remédios</span></h1>
        <p class="hero-sub" id="hero-sub">Cadastre seus medicamentos e horários. Tudo em um só lugar.</p>
      </div>
    </section>

    <section class="form-card" aria-label="Adicionar remédio">
      <h2 class="form-card-title">Adicionar novo</h2>
      <form id="remedio-form" class="stack-form">
        <label for="rem-name">Nome do remédio</label>
        <div class="field"><input id="rem-name" required placeholder="Ex: Losartana 50mg" /></div>
        <label for="rem-dosage">Dosagem</label>
        <div class="field"><input id="rem-dosage" placeholder="Ex: 1 comprimido" /></div>
        <label for="rem-schedule">Horários</label>
        <div class="field"><input id="rem-schedule" placeholder="Ex: 08:00, 20:00" /></div>
        <label for="rem-notes">Observações</label>
        <div class="field"><input id="rem-notes" placeholder="Ex: tomar após o almoço" /></div>
        <button class="submit-button" type="submit">Adicionar remédio</button>
      </form>
    </section>

    <section class="cards-grid" id="remedios-list" aria-label="Remédios cadastrados">
      <p class="empty-msg" id="empty-msg">Carregando...</p>
    </section>
  </main>

  <footer class="home-footer">
    <p>© 2026 querajuda.com</p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js?v=10"></script>
  <script>
  (function() {
    'use strict';

    function ready() {
      return new Promise((resolve) => {
        if (window.sbAPI) return resolve();
        const check = () => window.sbAPI ? resolve() : setTimeout(check, 50);
        check();
      });
    }

    ready().then(async () => {
      // Apply prefs
      const user = await window.sbAPI.getCurrentUser();
      if (!user) { window.location.href = 'index.html'; return; }
      const profile = await window.sbAPI.getMyProfile();
      if (profile) {
        if (profile.theme) document.documentElement.setAttribute('data-theme', profile.theme);
        if (profile.font_scale) document.documentElement.style.setProperty('--font-scale', String(profile.font_scale));
      }
    });

    // Theme toggle
    document.getElementById('theme-toggle')?.addEventListener('click', () => {
      const root = document.documentElement;
      const cur = root.getAttribute('data-theme') || 'light';
      const order = ['light', 'dark', 'auto'];
      const next = order[(order.indexOf(cur) + 1) % 3];
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('querajuda.theme', next); } catch (e) {}
    });

    // Logout
    document.addEventListener('click', async (e) => {
      if (e.target.closest('[data-action="logout"]')) {
        e.preventDefault();
        if (window.sbAPI) await window.sbAPI.signOut();
        window.location.href = 'index.html';
      }
    });

    // ===== CRUD de remédios =====
    // Para responsável: precisa escolher para qual idoso cadastrar
    // Para idoso: cadastra direto em si mesmo
    let currentIdosoId = null;
    let isResponsavel = false;

    async function setupContext() {
      const user = await window.sbAPI.getCurrentUser();
      if (!user) return;
      const profile = await window.sbAPI.getMyProfile();
      if (!profile) return;
      isResponsavel = profile.role === 'responsavel';
      if (isResponsavel) {
        const linkedIds = await window.sbAPI.getMyLinkedIdosoIds();
        if (linkedIds.length === 0) {
          const form = document.getElementById('remedio-form');
          form.innerHTML = '<p class="empty-msg">Você ainda não tem nenhum idoso vinculado. Volte para a home e adicione um idoso pelo e-mail.</p>';
          return null;
        }
        currentIdosoId = linkedIds[0];
      } else {
        currentIdosoId = user.id;
      }
      return currentIdosoId;
    }

    async function loadRemedios() {
      const id = await setupContext();
      if (!id) return;
      const list = document.getElementById('remedios-list');
      const { data, error } = await window.sbAPI.supabase
        .from('remedios')
        .select('*')
        .eq('idoso_id', id)
        .order('created_at', { ascending: false });
      if (error) {
        list.innerHTML = '<p class="empty-msg">Erro ao carregar remédios: ' + error.message + '</p>';
        return;
      }
      if (!data || data.length === 0) {
        list.innerHTML = '<p class="empty-msg" style="grid-column:1/-1">Nenhum remédio cadastrado ainda.</p>';
        return;
      }
      list.innerHTML = data.map(r => `
        <article class="feature-card" data-id="${r.id}">
          <span class="feature-emoji">💊</span>
          <h3 class="feature-title">${escapeHtml(r.name)}</h3>
          ${r.dosage ? `<p class="feature-desc"><strong>Dosagem:</strong> ${escapeHtml(r.dosage)}</p>` : ''}
          ${r.schedule ? `<p class="feature-desc"><strong>Horários:</strong> ${escapeHtml(r.schedule)}</p>` : ''}
          ${r.notes ? `<p class="feature-desc">${escapeHtml(r.notes)}</p>` : ''}
          <button class="text-link" data-del="${r.id}" style="margin-top:10px;color:#d33b3b">Remover</button>
        </article>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('remedio-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = currentIdosoId || await setupContext();
      if (!id) return;
      const name = document.getElementById('rem-name').value.trim();
      const dosage = document.getElementById('rem-dosage').value.trim();
      const schedule = document.getElementById('rem-schedule').value.trim();
      const notes = document.getElementById('rem-notes').value.trim();
      if (!name) return;
      const { error } = await window.sbAPI.supabase.from('remedios').insert({
        idoso_id: id, name, dosage, schedule, notes
      });
      if (error) { alert('Erro: ' + error.message); return; }
      e.target.reset();
      await loadRemedios();
    });

    document.getElementById('remedios-list')?.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-del]');
      if (!btn) return;
      if (!confirm('Remover este remédio?')) return;
      const { error } = await window.sbAPI.supabase.from('remedios').delete().eq('id', btn.dataset.del);
      if (error) { alert('Erro: ' + error.message); return; }
      await loadRemedios();
    });

    loadRemedios();
  })();
  </script>
  <style>
    .stack-form{display:grid;gap:6px;text-align:left;max-width:520px}
    .stack-form .submit-button{margin-top:14px}
    .form-card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px;margin-bottom:24px}
    .form-card-title{font-family:Nunito,sans-serif;font-size:1.4rem;margin:0 0 16px;color:var(--ink)}
    .empty-msg{color:var(--muted);padding:20px;text-align:center}
  </style>
</body>
</html>
