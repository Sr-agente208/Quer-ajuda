name: Gerar APK Android

on:
  push:
    branches: [main, arena/01a0367a-quer-ajuda]
  workflow_dispatch:

jobs:
  build-android:
    name: Criar APK do Quer Ajuda
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          arch: x86_64

      - name: Instalar dependências
        run: npm ci

      - name: Gerar versão web
        run: npm run build

      - name: Preparar projeto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: quer-ajuda-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Criar Release no GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          tag_name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
