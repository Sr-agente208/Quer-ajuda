<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#72cbbd" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Quer Ajuda?" />
  <title>Quer Ajuda? — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=19" />
  <script>
    (function() {
      // Aplica tema IMEDIATAMENTE antes de qualquer renderização
      try {
        var t = localStorage.getItem('querajuda.theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <script>
    // Registra service worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema">
    <svg viewBox="0 0 24 24" aria-hidden="true" id="theme-icon">
      <path class="icon-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor" stroke="none"/>
      <g class="icon-sun" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </g>
      <g class="icon-auto" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
      </g>
    </svg>
  </button>
  <main class="page-shell">
    <section class="brand-panel" aria-label="Quer Ajuda">
      <div class="orange-shape top-shape"></div>
      <div class="orange-shape bottom-shape"></div>
      <div class="brand-content">
        <div class="brand-logo" aria-hidden="true">
          <img src="WhatsApp%20Image%202026-08-24%20at%2009.27.16.jpeg" alt="" />
        </div>
        <p class="eyebrow">Apoio de verdade, quando você precisar</p>
        <h1>Quer <span>ajuda?</span></h1>
        <p class="brand-copy">Conectamos você a uma rede de cuidado, orientação e acolhimento.</p>
      </div>
      <p class="brand-footer">© 2026 querajuda.com</p>
    </section>

    <section class="login-panel" aria-labelledby="login-title">
      <div class="mobile-mark">
        <div class="mini-logo"><img src="WhatsApp%20Image%202026-08-24%20at%2009.27.16.jpeg" alt="" /></div>
        <strong>quer ajuda?</strong>
      </div>
      <div class="login-card">
        <div class="welcome-dot">✦</div>
        <p class="overline">BEM-VINDO</p>
        <h2 id="login-title">Entre ou crie sua conta</h2>
        <p class="intro">Só precisa de e-mail e senha. Se não existir, criamos agora.</p>

        <form id="login-form" novalidate>
          <fieldset class="role-selector" aria-label="Tipo de usuário">
            <legend>Quem é você?</legend>
            <div class="role-options">
              <label class="role-card" for="role-idoso">
                <input type="radio" id="role-idoso" name="role" value="idoso" required />
                <span class="role-icon" aria-hidden="true">👵</span>
                <span class="role-title">Sou idoso</span>
                <span class="role-desc">Quero receber apoio e cuidado</span>
              </label>
              <label class="role-card" for="role-responsavel">
                <input type="radio" id="role-responsavel" name="role" value="responsavel" required />
                <span class="role-icon" aria-hidden="true">🤝</span>
                <span class="role-title">Sou responsável</span>
                <span class="role-desc">Vou cuidar de um idoso</span>
              </label>
            </div>
          </fieldset>
          <label for="full-name">Seu nome</label>
          <div class="field">
            <input id="full-name" name="full-name" type="text" placeholder="Como podemos te chamar?" autocomplete="name" required style="font-size:16px;width:100%;border:0;outline:0;font:inherit;background:transparent" />
          </div>
          <label for="email">E-mail</label>
          <div class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11h-17zM4 7l8 6 8-6" /></svg>
            <input id="email" name="email" type="email" placeholder="voce@email.com" autocomplete="email" required />
          </div>
          <label for="password">Senha</label>
          <div class="field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
            <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required minlength="6" />
            <button class="eye" type="button" aria-label="Mostrar senha" id="password-toggle">◉</button>
          </div>
          <button class="submit-button" type="submit" id="submit-btn">Entrar <span>→</span></button>
          <p class="form-message" id="form-message" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js?v=16"></script>
</body>
</html>
